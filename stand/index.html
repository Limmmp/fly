<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Муха в проводах</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Муха в проводах</h1>
  <p class="lead">Настоящий мозг мухи: <b>138 639</b> нейронов. Угости муху и посмотри, как бежит сигнал!</p>
</header>

<main>
  <section class="brain">
    <canvas id="brain"></canvas>
    <div id="tags"></div>
    <div id="status" class="status"></div>
    <div class="counters">
      <div><span id="cnt-neurons">0</span><small>нейронов вспыхнуло</small></div>
      <div><span id="cnt-spikes">0</span><small>сигналов</small></div>
    </div>
  </section>

  <section class="side">
    <canvas id="fly"></canvas>
    <div class="meter"><div class="meter-label">Хоботок</div><div class="meter-bar"><div id="meter-fill"></div></div></div>
    <div id="result" class="result hidden">
      <div id="result-icon" class="result-icon"></div>
      <div id="result-title" class="result-title"></div>
      <div id="result-text" class="result-text"></div>
    </div>
  </section>
</main>

<nav class="controls">
  <button class="stim" data-stim="sugar"><span data-icon="sugar"></span>Сахар<kbd>1</kbd></button>
  <button class="stim" data-stim="bitter"><span data-icon="bitter"></span>Горькое<kbd>2</kbd></button>
  <button class="stim" data-stim="water"><span data-icon="water"></span>Вода<kbd>3</kbd></button>
  <button id="lesion" class="lesion" aria-pressed="false"><span data-icon="lesion"></span><b id="lesion-text">Сломать нейрон</b><kbd>4</kbd></button>
</nav>

<footer>
  Данные: FlyWire 783 (CC-BY 4.0) · модель: Shiu et al. 2024 ·
  <button id="info-btn" class="link">источники</button>
</footer>

<div id="info" class="overlay hidden"><div class="overlay-box">
  <pre id="info-text"></pre>
  <button id="info-close" class="big">Закрыть</button>
</div></div>

<script src="vendor/three.min.js"></script>
<script src="icons.js"></script>
<script src="../data/export/fly_data.js"></script>
<script src="app.js"></script>
</body>
</html>
