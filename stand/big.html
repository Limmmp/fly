<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Муха в проводах — большой экран</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="big.css">
</head>
<body>
<!-- Вариант для большого монитора: мозг на весь экран, панели поверх -->
<section class="brain">
  <canvas id="brain"></canvas>
  <div id="tags"></div>
</section>
<div class="vignette"></div>

<header class="glass head">
  <div class="eyebrow">Интерактивный экспонат</div>
  <h1>Муха в&nbsp;проводах</h1>
  <p class="sub">Настоящий мозг мухи — <b class="num">138 639</b> нейронов и&nbsp;2,7&nbsp;млн связей</p>
  <div id="status" class="status"></div>
  <div class="stats">
    <div class="counters">
      <div><div class="eyebrow">Вспыхнуло нейронов</div><span id="cnt-neurons" class="num">0</span></div>
      <div><div class="eyebrow">Сигналов</div><span id="cnt-spikes" class="num">0</span></div>
    </div>
    <ul class="legend">
      <li style="--c:#ffc83c">датчики</li>
      <li style="--c:#4fc3ff">мозг</li>
      <li style="--c:#ff5ad2">команды телу</li>
      <li style="--c:#7dff7a">мышцы</li>
    </ul>
  </div>
  <div class="credits">FlyWire 783 · CC-BY 4.0 · модель Shiu et al. 2024 ·
    <button id="info-btn" class="link"><span class="ico-s" data-icon="info"></span>источники</button></div>
</header>

<aside class="side">
  <div class="glass flybox">
    <div class="eyebrow box-title">Муха</div>
    <canvas id="fly"></canvas>
    <div class="meter">
      <span id="meter-label">Хоботок</span>
      <div class="meter-bar"><div id="meter-fill"></div></div>
    </div>
  </div>
  <div id="result" class="glass result hidden">
    <div id="result-icon" class="result-icon"></div>
    <div>
      <div id="result-title" class="result-title"></div>
      <div id="result-text" class="result-text"></div>
    </div>
  </div>
</aside>



<div class="zoom glass">
  <button data-view="in" aria-label="Приблизить"><span class="ico" data-icon="plus"></span></button>
  <button data-view="out" aria-label="Отдалить"><span class="ico" data-icon="minus"></span></button>
  <button data-view="reset" aria-label="Сбросить вид"><span class="ico" data-icon="reset"></span></button>
</div>

<nav class="controls glass">
  <div class="grp">
    <div class="eyebrow">Вкус</div>
    <div class="row">
      <button class="stim" data-stim="sugar"><span class="ico" data-icon="sugar"></span>Сахар<kbd>1</kbd></button>
      <button class="stim" data-stim="bitter"><span class="ico" data-icon="bitter"></span>Горькое<kbd>2</kbd></button>
      <button class="stim" data-stim="water"><span class="ico" data-icon="water"></span>Вода<kbd>3</kbd></button>
    </div>
  </div>
  <div class="grp">
    <div class="eyebrow">Мир вокруг</div>
    <div class="row">
      <button class="stim" data-stim="loom"><span class="ico" data-icon="loom"></span>Тень<kbd>4</kbd></button>
      <button class="stim" data-stim="smell"><span class="ico" data-icon="smell"></span>Запах<kbd>5</kbd></button>
      <button class="stim" data-stim="touch"><span class="ico" data-icon="touch"></span>Касание<kbd>6</kbd></button>
    </div>
  </div>
  <div class="grp">
    <div class="eyebrow">Опыт</div>
    <div class="row">
      <button id="lesion" class="lesion" aria-pressed="false"><span class="ico" data-icon="lesion"></span><b id="lesion-text">Сломать нейрон</b><kbd>0</kbd></button>
    </div>
  </div>
</nav>


<div id="info" class="overlay hidden"><div class="overlay-box glass">
  <pre id="info-text"></pre>
  <button id="info-close" class="big">Закрыть</button>
</div></div>

<script>
  // мозг сдвигаем чуть вверх (снизу кнопки) и вправо (слева карточка заголовка)
  window.STAND_OPTS = { shiftX: -0.05, shiftY: 0.08 };
</script>
<script src="vendor/three.min.js"></script>
<script src="../shared/icons.js"></script>
<script src="../data/export/fly_data.js"></script>
<script src="app.js"></script>
</body>
</html>
